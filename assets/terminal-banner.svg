    <path fill="url(#grid)" mask="url(#reveal-grid)" d="M0 0h960v252H0z"/>
    <path fill="#0e1520" fill-opacity=".72" d="M0 0h960v54H0z"/>
    <path fill="none" stroke="url(#rail)" d="M41 54.5h548l11-11h318M42 222.5h304l10-10h562"/>
