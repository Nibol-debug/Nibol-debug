    <circle cx="58" cy="29" r="4.5" fill="#546879"/>
    <circle cx="74" cy="29" r="4.5" fill="#a38aca"/>
    <path fill="none" stroke="#425268" stroke-width="1.5" d="M905 26h15m-15 6h10"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
