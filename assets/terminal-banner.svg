    <text x="40" y="143" fill="#dffaf5" font-size="82" font-weight="700" letter-spacing="-5">NIBOL<tspan fill="#6cead5">-DEBUG</tspan></text>
    <text x="44" y="184" fill="#adc7d4" font-size="23" letter-spacing="-.6">Web development <tspan fill="#74cbbf">/</tspan> Layer 3 networking<tspan fill="#6cead5" dx="12">&#x258C;</tspan></text>
  </g>

  <g transform="translate(766 131)">
