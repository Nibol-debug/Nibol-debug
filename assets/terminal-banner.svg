<svg xmlns="http://www.w3.org/2000/svg" width="960" height="252" viewBox="0 0 960 252" role="img" aria-labelledby="title desc">
  <title id="title">Nibol-debug</title>
  <desc id="desc">Banner terminal berwarna hijau toska dengan diagram jaringan dan teks Web Development / Layer 3 Networking.</desc>
  <defs>
    <path id="frame" d="M18 1H940l19 19v214l-18 17H18L1 234V18Z"/>
    <clipPath id="bounds"><use href="#frame"/></clipPath>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 24V0h24" fill="none" stroke="#29434c" stroke-width="1"/>
    </pattern>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#131b2b"/>
      <stop offset="1" stop-color="#0e252d"/>
    </linearGradient>
    <linearGradient id="grid-fade" x2="1" y2="0">
      <stop offset=".30" stop-color="#000"/>
      <stop offset=".89" stop-color="#fff"/>
    </linearGradient>
    <mask id="reveal-grid">
      <path fill="url(#grid-fade)" d="M0 0h960v252H0z"/>
    </mask>
    <linearGradient id="rail" x2="1" y2="0">
      <stop stop-color="#5bd8c6"/>
      <stop offset=".62" stop-color="#264450"/>
      <stop offset="1" stop-color="#4f4480"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#bounds)">
