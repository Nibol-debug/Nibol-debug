<svg xmlns="http://www.w3.org/2000/svg" width="720" height="296" viewBox="0 0 180 74" role="img" aria-labelledby="title desc">
  <title id="title">Potret pixel di angin malam</title>
  <desc id="desc">Karakter dengan mata hijau, rambut ungu gelap, dan seragam putih. Ia berkedip sementara angin menggerakkan ujung rambutnya.</desc>
  <style>
    .rear-lock, .front-lock {
      transform-origin: 0 0;
      animation: sway 4.8s ease-in-out infinite;
    }
    .front-lock { animation-name: sway-front; animation-delay: -.65s; }
    .loose-strand { animation-delay: -1.2s; }
    .eyes-open, .eyes-half, .eyes-shut { animation: 6.4s steps(1, end) infinite; }
    .eyes-open { animation-name: blink-open; }
    .eyes-half { animation-name: blink-half; opacity: 0; }
    .eyes-shut { animation-name: blink-shut; opacity: 0; }
    .gust { animation: drift 6s ease-in-out infinite; }
    .gust-later { animation-delay: -2.6s; }

    @keyframes sway {
      0%, 100% { transform: rotate(-2deg); }
      30% { transform: rotate(4deg); }
      59% { transform: rotate(1.5deg); }
      76% { transform: rotate(3deg); }
    }
    @keyframes sway-front {
      0%, 100% { transform: rotate(-1deg); }
      32% { transform: rotate(3.5deg); }
      63% { transform: rotate(.5deg); }
    }
    @keyframes blink-open {
      0%, 18%, 61%, 100% { opacity: 1; }
      14%, 57% { opacity: 0; }
    }
    @keyframes blink-half {
      0%, 15%, 18%, 58%, 61%, 100% { opacity: 0; }
      14%, 16.7%, 57%, 59.7% { opacity: 1; }
    }
    @keyframes blink-shut {
      0%, 16.7%, 59.7%, 100% { opacity: 0; }
      15%, 58% { opacity: 1; }
    }
    @keyframes drift {
      0%, 100% { transform: translateX(-2px); opacity: .3; }
      49% { transform: translateX(5px); opacity: .9; }
      72% { opacity: .55; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rear-lock, .front-lock, .eyes-open, .eyes-half, .eyes-shut, .gust {
        animation: none;
      }
    }
  </style>

